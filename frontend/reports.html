<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan — Go Kasir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="main">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="menu-toggle" id="btnMenu"><i class="bi bi-list"></i></button>
        <h5 class="mb-0" id="pageTitle">Laporan</h5>
      </div>
      <span class="text-muted small" id="topOwner"></span>
    </div>
    <div class="content">
      <div class="panel">
        <div class="row g-2 align-items-end">
          <div class="col-auto"><label class="form-label small mb-0">Dari</label><input type="date" id="from" class="form-control"></div>
          <div class="col-auto"><label class="form-label small mb-0">Sampai</label><input type="date" id="to" class="form-control"></div>
          <div class="col-auto"><label class="form-label small mb-0">Grup</label>
            <select id="groupBy" class="form-select"><option value="day">Harian</option><option value="week">Mingguan</option><option value="month">Bulanan</option><option value="year">Tahunan</option></select>
          </div>
          <div class="col-auto"><button class="btn btn-accent" id="btnLoad">Tampilkan</button></div>
        </div>
      </div>

      <ul class="nav nav-pills mb-3" id="reportTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="sales">Penjualan</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="products">Produk</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="pl">Laba Rugi</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="trx">Transaksi</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="cust">Pelanggan</button></li>
      </ul>

      <div id="panelSales">
        <div class="d-flex gap-2 mb-2">
          <button class="btn btn-sm btn-outline-danger" data-exp="sales" data-fmt="pdf"><i class="bi bi-file-pdf"></i> Export PDF</button>
          <button class="btn btn-sm btn-outline-success" data-exp="sales" data-fmt="excel"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-3"><div class="stat-card"><div class="label">Omzet</div><div class="value fs-5" id="sRev">—</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="label">Laba Kotor</div><div class="value fs-5" id="sProfit">—</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="label">Transaksi</div><div class="value fs-5" id="sCnt">—</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="label">Rata-rata</div><div class="value fs-5" id="sAvg">—</div></div></div>
        </div>
        <div class="row g-3">
          <div class="col-lg-7"><div class="panel"><h6>Tren Penjualan</h6><div class="chart-box"><canvas id="salesBar"></canvas></div></div></div>
          <div class="col-lg-5"><div class="panel"><h6>Per Metode Bayar</h6><div class="chart-box"><canvas id="salesPie"></canvas></div></div></div>
        </div>
      </div>

      <div id="panelProducts" class="d-none">
        <div class="d-flex gap-2 mb-2">
          <button class="btn btn-sm btn-outline-danger" data-exp="products" data-fmt="pdf">Export PDF</button>
          <button class="btn btn-sm btn-outline-success" data-exp="products" data-fmt="excel">Export Excel</button>
        </div>
        <div class="row g-3">
          <div class="col-lg-6"><div class="panel"><h6>Produk Terlaris</h6><table class="table table-sm"><thead><tr><th>Produk</th><th>Qty</th><th>Omzet</th></tr></thead><tbody id="topProd"></tbody></table></div></div>
          <div class="col-lg-6"><div class="panel"><h6>Per Kategori</h6><div class="chart-box"><canvas id="prodPie"></canvas></div></div></div>
        </div>
      </div>

      <div id="panelPL" class="d-none">
        <div class="d-flex gap-2 mb-2">
          <button class="btn btn-sm btn-outline-danger" data-exp="profit-loss" data-fmt="pdf">Export PDF</button>
          <button class="btn btn-sm btn-outline-success" data-exp="profit-loss" data-fmt="excel">Export Excel</button>
        </div>
        <div class="row g-3">
          <div class="col-md-4"><div class="stat-card"><div class="label">Pendapatan</div><div class="value fs-5" id="plRev">—</div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="label">HPP</div><div class="value fs-5" id="plCogs">—</div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="label">Laba Kotor</div><div class="value fs-5" id="plProfit">—</div></div></div>
        </div>
      </div>

      <div id="panelTrx" class="d-none">
        <div class="d-flex gap-2 mb-2">
          <button class="btn btn-sm btn-outline-danger" data-exp="transactions" data-fmt="pdf">Export PDF</button>
          <button class="btn btn-sm btn-outline-success" data-exp="transactions" data-fmt="excel">Export Excel</button>
        </div>
        <div class="panel"><table class="table table-sm"><thead><tr><th>Invoice</th><th>Tanggal</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead><tbody id="trxBody"></tbody></table></div>
      </div>

      <div id="panelCust" class="d-none">
        <div class="row g-2 mb-2">
          <div class="col-auto"><select id="custId" class="form-select"></select></div>
          <div class="col-auto"><button class="btn btn-outline-secondary" id="btnCust">Muat</button></div>
          <div class="col-auto"><button class="btn btn-sm btn-outline-danger" data-exp="customer" data-fmt="pdf">Export PDF</button></div>
          <div class="col-auto"><button class="btn btn-sm btn-outline-success" data-exp="customer" data-fmt="excel">Export Excel</button></div>
        </div>
        <div class="panel"><table class="table table-sm"><thead><tr><th>Invoice</th><th>Tanggal</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead><tbody id="custBody"></tbody></table></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
initShell('reports', 'Laporan');
qs('#from').value = daysAgoStr(30); qs('#to').value = todayStr();
let barChart, pieChart, prodPie;
let activeTab = 'sales';

const panels = {
  sales: 'panelSales', products: 'panelProducts', pl: 'panelPL', trx: 'panelTrx', cust: 'panelCust'
};

qsa('#reportTabs .nav-link').forEach(btn => {
  btn.addEventListener('click', () => {
    qsa('#reportTabs .nav-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    Object.values(panels).forEach(id => qs('#'+id).classList.add('d-none'));
    qs('#'+panels[activeTab]).classList.remove('d-none');
  });
});

function range() { return `from=${qs('#from').value}&to=${qs('#to').value}`; }

async function loadSales() {
  const { data } = await api(`/reports/sales?${range()}&group_by=${qs('#groupBy').value}`);
  const s = data.summary || {};
  qs('#sRev').textContent = formatRp(s.total_revenue);
  qs('#sProfit').textContent = formatRp(s.gross_profit);
  qs('#sCnt').textContent = s.transaction_count;
  qs('#sAvg').textContent = formatRp(s.avg_transaction);
  const trend = data.trend || [];
  barChart?.destroy();
  barChart = new Chart(qs('#salesBar'), {
    type: 'bar',
    data: { labels: trend.map(t=>t.period), datasets: [{ label:'Omzet', data: trend.map(t=>t.total), backgroundColor:'#0d9488' }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
  });
  const pay = data.by_payment || [];
  pieChart?.destroy();
  pieChart = new Chart(qs('#salesPie'), {
    type: 'pie',
    data: { labels: pay.map(p=>p.payment_method), datasets:[{ data: pay.map(p=>p.total), backgroundColor:['#0d9488','#0284c7','#ca8a04'] }] },
    options: { responsive:true, maintainAspectRatio:false }
  });
}

async function loadProducts() {
  const { data } = await api(`/reports/products?${range()}`);
  qs('#topProd').innerHTML = (data.top_products||[]).map(p =>
    `<tr><td>${p.product_name}</td><td>${p.quantity}</td><td>${formatRp(p.revenue)}</td></tr>`).join('');
  const cats = data.by_category || [];
  prodPie?.destroy();
  prodPie = new Chart(qs('#prodPie'), {
    type: 'pie',
    data: { labels: cats.map(c=>c.category_name), datasets:[{ data: cats.map(c=>c.total), backgroundColor:['#0d9488','#0284c7','#ca8a04','#dc2626','#7c3aed'] }] },
    options: { responsive:true, maintainAspectRatio:false }
  });
}

async function loadPL() {
  const { data } = await api(`/reports/profit-loss?${range()}`);
  const s = data.summary || {};
  qs('#plRev').textContent = formatRp(s.total_revenue);
  qs('#plCogs').textContent = formatRp(s.total_cogs);
  qs('#plProfit').textContent = formatRp(s.gross_profit);
}

async function loadTrx() {
  const { data } = await api(`/reports/transactions?${range()}&limit=200`);
  qs('#trxBody').innerHTML = (data.items||[]).map(t =>
    `<tr><td>${t.invoice_no}</td><td>${new Date(t.created_at).toLocaleString('id-ID')}</td><td>${formatRp(t.total)}</td><td>${t.payment_method}</td><td>${t.status}</td></tr>`).join('');
}

async function loadCustList() {
  const { data } = await api('/customers?limit=100');
  qs('#custId').innerHTML = (data.items||[]).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

async function loadCust() {
  const id = qs('#custId').value;
  if (!id) return;
  const { data } = await api(`/reports/customers/${id}?${range()}`);
  qs('#custBody').innerHTML = (data.purchases||[]).map(p =>
    `<tr><td>${p.invoice_no}</td><td>${p.created_at}</td><td>${formatRp(p.total)}</td><td>${p.payment_method}</td><td>${p.status}</td></tr>`).join('')
    || '<tr><td colspan="5" class="text-muted">Tidak ada data</td></tr>';
}

qs('#btnLoad').onclick = async () => {
  try {
    await Promise.all([loadSales(), loadProducts(), loadPL(), loadTrx()]);
    toast('Laporan dimuat');
  } catch(e){ toast(e.message,'error'); }
};
qs('#btnCust').onclick = () => loadCust().catch(e => toast(e.message,'error'));

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-exp]');
  if (!btn) return;
  const type = btn.dataset.exp;
  const fmt = btn.dataset.fmt;
  let path = `/reports/${type}/${fmt}?${range()}`;
  let fname = `laporan_${type}.${fmt==='pdf'?'pdf':'xlsx'}`;
  if (type === 'customer') {
    const id = qs('#custId').value;
    if (!id) return toast('Pilih pelanggan', 'error');
    path = `/reports/customers/${id}/${fmt}?${range()}`;
    fname = `laporan_pelanggan.${fmt==='pdf'?'pdf':'xlsx'}`;
  }
  try { await downloadAuth(path, fname); }
  catch(ex){ toast(ex.message,'error'); }
});

loadCustList().then(() => qs('#btnLoad').click()).catch(e => toast(e.message,'error'));
</script>
</body>
</html>
