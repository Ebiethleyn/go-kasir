<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelanggan — Go Kasir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>

<body>
  <div class="app-shell" id="appShell">
    <div class="main">
      <div class="topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="menu-toggle" id="btnMenu"><i class="bi bi-list"></i></button>
          <h5 class="mb-0" id="pageTitle">Pelanggan</h5>
        </div>
        <span class="text-muted small" id="topOwner"></span>
      </div>
      <div class="content">
        <div class="panel">
          <div class="d-flex flex-wrap gap-2 mb-3">
            <input id="search" class="form-control" style="max-width:240px" placeholder="Cari nama/telepon...">
            <select id="sortTransactions" class="form-select" style="max-width:240px"
              aria-label="Urutkan berdasarkan jumlah transaksi">
              <option value="">Urut nama</option>
              <option value="transactions_desc">Transaksi terbanyak</option>
              <option value="transactions_asc">Transaksi tersedikit</option>
            </select>
            <button class="btn btn-accent ms-auto" id="btnAdd"><i class="bi bi-plus"></i> Tambah</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover">
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>Telepon</th>
                  <th>Email</th>
                  <th>Alamat</th>
                  <th>Jumlah Transaksi</th>
                  <th>Total Nominal Transaksi</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Pelanggan</h5><button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="cId">
          <div class="mb-2"><label class="form-label">Nama</label><input id="cName" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Telepon</label><input id="cPhone" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Email</label><input id="cEmail" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Alamat</label><input id="cAddress" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Catatan</label><input id="cNotes" class="form-control"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-accent" id="btnSave">Simpan</button></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initShell('customers', 'Pelanggan');
    const modal = new bootstrap.Modal('#modal');
    let isLoading = false;
    async function load() {
      if (isLoading) return;
      isLoading = true;
      try {
        const params = new URLSearchParams({
          search: qs('#search').value,
          sort: qs('#sortTransactions').value,
          limit: '100'
        });
        const { data } = await api('/customers?' + params);
        qs('#body').innerHTML = (data.items || []).map(c => `
    <tr><td>${c.name}</td><td>${c.phone || ''}</td><td>${c.email || ''}</td><td>${c.address || ''}</td><td>${Number(c.transaction_count ?? c.TransactionCount) || 0}</td><td>${formatRp(Number(c.transaction_total ?? c.TransactionTotal) || 0)}</td>
    <td><button class="btn btn-sm btn-outline-primary" data-edit='${JSON.stringify(c).replace(/'/g, "&#39;")}'><i class="bi bi-pencil"></i></button>
    <button class="btn btn-sm btn-outline-danger" data-del="${c.id}"><i class="bi bi-trash"></i></button></td></tr>`).join('');
      } finally {
        isLoading = false;
      }
    }
    qs('#btnAdd').onclick = () => {
      qs('#cId').value = '';['cName', 'cPhone', 'cEmail', 'cAddress', 'cNotes'].forEach(i => qs('#' + i).value = '');
      modal.show();
    };
    qs('#btnSave').onclick = async () => {
      const payload = { name: qs('#cName').value, phone: qs('#cPhone').value, email: qs('#cEmail').value, address: qs('#cAddress').value, notes: qs('#cNotes').value };
      try {
        const id = qs('#cId').value;
        if (id) await api('/customers/' + id, { method: 'PUT', body: JSON.stringify(payload) });
        else await api('/customers', { method: 'POST', body: JSON.stringify(payload) });
        modal.hide(); toast('Disimpan'); load();
      } catch (e) { toast(e.message, 'error'); }
    };
    qs('#body').addEventListener('click', async e => {
      const del = e.target.closest('[data-del]');
      const edit = e.target.closest('[data-edit]');
      if (del && confirm('Hapus?')) { await api('/customers/' + del.dataset.del, { method: 'DELETE' }); load(); }
      if (edit) {
        const c = JSON.parse(edit.dataset.edit.replace(/&#39;/g, "'"));
        qs('#cId').value = c.id; qs('#cName').value = c.name; qs('#cPhone').value = c.phone || '';
        qs('#cEmail').value = c.email || ''; qs('#cAddress').value = c.address || ''; qs('#cNotes').value = c.notes || '';
        modal.show();
      }
    });
    qs('#search').addEventListener('keyup', e => { if (e.key === 'Enter') load(); });
    qs('#sortTransactions').addEventListener('change', load);
    window.setInterval(() => {
      if (document.visibilityState === 'visible') load().catch(() => { });
    }, 5000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') load().catch(() => { });
    });
    load().catch(e => toast(e.message, 'error'));
  </script>
</body>

</html>
