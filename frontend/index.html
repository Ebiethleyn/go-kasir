<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Go Kasir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <button class="btn btn-sm btn-outline-secondary theme-toggle login-theme-toggle" type="button"
        data-theme-toggle></button>
      <div class="text-center mb-3">
        <i class="bi bi-shop fs-1 text-teal" style="color:#0d9488"></i>
        <h1>Go Kasir</h1>
        <p class="text-muted mb-0">Masuk sebagai Owner</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="username" value="admin" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" value="admin123" required>
        </div>
        <div id="loginError" class="alert alert-danger d-none py-2"></div>
        <button class="btn btn-accent w-100" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Masuk
        </button>
      </form>
      <p class="text-muted small text-center mt-3 mb-0">Default: admin / admin123</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (Auth.getToken()) location.href = 'dashboard.html';
    qs('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = qs('#loginError');
      err.classList.add('d-none');
      try {
        const body = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: qs('#username').value.trim(),
            password: qs('#password').value
          })
        });
        Auth.setSession(body.data);
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
